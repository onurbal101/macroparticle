<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="application-name" content="Mikrodalga Rehberi" />
    <meta name="apple-mobile-web-app-title" content="Mikrodalga" />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("microwave-companion-v1") || "{}")?.theme;
        if (theme === "light" || theme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = theme;
        }
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#141319" : "#f2f2f7";
      } catch {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <!--page-meta:start-->
    <title>Mikrodalga Rehberi</title>
    <meta name="description" content="Samsung MS23K3555ES/ND için programlar, hazırlık bilgileri, adım adım kullanım ve mikrodalga simülasyonu." />
    <!--page-meta:end-->
  </head>
  <body>
    <noscript>
      <style>
        @layer base { .steps > li[hidden] { display: list-item !important; } }
        .steps { list-style: decimal; padding-inline-start: 1.5em; }
        .step-controls, .step-heading .text-button, .step-heading .heading-detail,
        .program-favorite, .favorite-mode-button, .notes, .mobile-step-panel,
        .floating-search { display: none !important; }
      </style>
      <p class="notice">Etkileşimli özellikler için JavaScript gerekir.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
