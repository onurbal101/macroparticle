<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("microwave-companion-v1") || "{}")?.theme;
        if (theme === "light" || theme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = theme;
        }
      } catch {}
    </script>
    <meta name="description" content="Samsung MS23K3555ES/ND için adım adım programlar, düğmeler ve çevrimdışı kullanım rehberi." />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Mikrodalga Rehberi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
